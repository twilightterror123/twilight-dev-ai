name: Build Twilight Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  TWILIGHT_APP_URL: https://twilight-dev-ai.vercel.app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-windows
          path: dist-app/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Build Debian installer
        run: npx electron-builder --linux deb --x64 --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-linux
          path: dist-app/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true
      - run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p dist-app
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-app/Twilight-latest-android.apk
          test -s dist-app/Twilight-latest-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-android
          path: dist-app/Twilight-latest-android.apk
          if-no-files-found: error

  release-desktop:
    needs: [windows, linux]
    if: ${{ needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Normalize desktop installers
        run: |
          mkdir -p release-final
          find release -type f -name '*.exe' -exec cp {} release-final/Twilight-latest-windows.exe \;
          find release -type f -name '*.deb' -exec cp {} release-final/Twilight-latest-linux.deb \;
          test -s release-final/Twilight-latest-windows.exe
          test -s release-final/Twilight-latest-linux.deb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: twilight-desktop-${{ github.run_number }}
          name: TWILIGHT Desktop Build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: release-final/*

  release-android:
    needs: android
    if: ${{ needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: twilight-android
          path: release
      - name: Verify Android installer
        run: |
          test -s release/Twilight-latest-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: twilight-android-${{ github.run_number }}
          name: TWILIGHT Android Build ${{ github.run_number }}
          prerelease: false
          files: release/Twilight-latest-android.apk
