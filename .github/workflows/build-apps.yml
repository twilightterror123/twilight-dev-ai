name: Build Twilight Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  TWILIGHT_APP_URL: https://twilight-dev-ai.vercel.app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $file = Get-ChildItem dist-app -Filter *.exe | Select-Object -First 1
          if (-not $file) { throw "Windows installer was not created." }
          if ($file.Length -lt 1MB) { throw "Windows installer looks invalid or empty." }
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-windows
          path: dist-app/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Build Debian installer
        run: npx electron-builder --linux deb --x64
      - name: Verify Debian installer
        run: |
          file=$(find dist-app -type f -name '*.deb' | head -n 1)
          test -n "$file"
          test -s "$file"
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-linux
          path: dist-app/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true
      - run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Build Android APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            if ./gradlew assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed; retrying..."
              sleep 10
            fi
          done
          exit 1
      - name: Prepare APK
        run: |
          mkdir -p dist-app
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-app/Twilight-latest-android.apk
          test -s dist-app/Twilight-latest-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-android
          path: dist-app/Twilight-latest-android.apk
          if-no-files-found: error

  release:
    needs: [windows, linux, android]
    if: ${{ needs.windows.result == 'success' && needs.linux.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Normalize and verify installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-final
          find release -type f -name '*.exe' -exec cp {} release-final/Twilight-latest-windows.exe \;
          find release -type f -name '*.deb' -exec cp {} release-final/Twilight-latest-linux.deb \;
          find release -type f -name '*.apk' -exec cp {} release-final/Twilight-latest-android.apk \;
          test -s release-final/Twilight-latest-windows.exe
          test -s release-final/Twilight-latest-linux.deb
          test -s release-final/Twilight-latest-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: twilight-build-${{ github.run_number }}
          name: TWILIGHT Build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: release-final/*
